name: Dots OCR CPU smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-ocr:
    # Public repositories receive standard GitHub-hosted runners at no charge.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTS_DEVICE: cpu
      DOTS_NUM_THREADS: "4"
      DOTS_MAX_NEW_TOKENS: "512"
      DOTS_MODEL_PATH: vendor/dots.ocr/weights/DotsMOCR
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runner resources
        run: |
          python --version
          lscpu
          free -h
          df -h .

      - name: Install CPU PyTorch and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install transformers==4.56.1 accelerate qwen-vl-utils huggingface_hub modelscope cairosvg

      - name: Download official Dots OCR source
        run: |
          git clone --depth 1 https://github.com/studio-dots-ai/dots.ocr.git vendor/dots.ocr
          python -m pip install -e vendor/dots.ocr --no-deps

      - name: Download Dots model weights
        working-directory: vendor/dots.ocr
        run: python tools/download_model.py

      - name: Patch Dots vision attention for CPU-only runtime
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path("vendor/dots.ocr/weights/DotsMOCR"), Path("vendor/dots.ocr")]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob("modeling_dots_vision.py"))
          if not files:
              raise SystemExit("Could not find modeling_dots_vision.py in downloaded Dots model files")

          patched = 0
          for path in files:
              source = path.read_text(encoding="utf-8")
              original = source
              direct_import = "from flash_attn import flash_attn_varlen_func"

              if direct_import in source:
                  safe_import = "\\n".join([
                      "flash_attn_available = True",
                      "try:",
                      "    from flash_attn import flash_attn_varlen_func",
                      "except ImportError:",
                      "    flash_attn_available = False",
                      "    flash_attn_varlen_func = None",
                  ])
                  source = source.replace(direct_import, safe_import, 1)

              if "class DotsVisionBlock" in source and "FlashAttention unavailable; using eager CPU attention" not in source:
                  class_pos = source.find("class DotsVisionBlock")
                  init_pos = source.find("        super().__init__()", class_pos)
                  if init_pos >= 0:
                      line_end = source.find("\\n", init_pos)
                      if line_end < 0:
                          raise SystemExit(f"Could not locate initializer line ending in {path}")
                      line_start = source.rfind("\\n", 0, init_pos) + 1
                      indent = source[line_start:init_pos]
                      fallback_lines = [
                          indent + 'if attn_implementation == "flash_attention_2" and not flash_attn_available:',
                          indent + '    attn_implementation = "eager"',
                          indent + '    print("FlashAttention unavailable; using eager CPU attention")',
                          indent + 'if attn_implementation == "ascend_fa":',
                          indent + '    attn_implementation = "eager"',
                      ]
                      source = source[:line_end + 1] + "\\n".join(fallback_lines) + "\\n" + source[line_end + 1:]

              try:
                  ast.parse(source)
              except SyntaxError as exc:
                  raise SystemExit(f"Patched Python syntax error in {path}: {exc}")

              if source != original:
                  path.write_text(source, encoding="utf-8")
                  patched += 1
                  print(f"Patched CPU fallback: {path}")

          if patched == 0:
              raise SystemExit("No patch applied; the downloaded model may already contain a CPU fallback.")
          PY

      - name: Create a synthetic OCR test image
        run: |
          mkdir -p test-output
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new("RGB", (1400, 500), "white")
          draw = ImageDraw.Draw(image)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          font = ImageFont.truetype(font_path, 48)
          lines = [
              "INVOICE - OCR TEST",
              "Supplier: Example Industrial Co.",
              "Invoice No: INV-2026-00125",
              "Date: 2026-11-13",
              "Total Amount: 125,450.75 USD",
          ]
          y = 35
          for line in lines:
              draw.text((40, y), line, fill="black", font=font)
              y += 85
          image.save("test-output/sample-invoice.png")
          PY

      - name: Run real CPU OCR inference
        run: |
          python - <<'PY'
          import json, os, platform, time
          from pathlib import Path
          import torch
          from backend.engine import run_ocr, status

          print("Python:", platform.python_version())
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Model status:", json.dumps(status(), ensure_ascii=False))
          started = time.time()
          text = run_ocr("test-output/sample-invoice.png")
          elapsed = time.time() - started
          Path("test-output/ocr-result.txt").write_text(text, encoding="utf-8")
          report = {
              "device": "cpu",
              "elapsed_seconds": round(elapsed, 2),
              "output_characters": len(text),
              "output": text,
          }
          Path("test-output/report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not text.strip():
              raise SystemExit("OCR returned an empty result")
          PY

      - name: Upload OCR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dots-ocr-cpu-test-report
          path: test-output/
          if-no-files-found: warn
          retention-days: 7
